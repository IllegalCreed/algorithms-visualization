# Include this file in both the server block and any location that declares its
# own add_header directives. Nginx otherwise stops inheriting parent headers.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;

# AdSense dynamically loads changing third-party origins. A static allowlist
# produces console-only Report-Only noise and cannot be promoted safely.
# Reintroduce CSP only with a per-response nonce and strict-dynamic support.
